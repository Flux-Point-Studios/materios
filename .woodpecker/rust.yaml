when:
  - event: [push, pull_request]
    branch: main

# Pinned by a custom label that only the agent with room for this cold build
# carries. The agent's hostname label is its container id, which changes
# whenever the container is recreated and would leave a pinned pipeline
# pending.
labels:
  arm64-emu: "true"

steps:
  # Advisory, as in the GitHub workflow (continue-on-error): main is not
  # rustfmt-clean.
  - name: fmt
    image: rust:1.85.0-bookworm
    failure: ignore
    directory: partnerchain
    commands:
      - cargo fmt --all -- --check

  # Image tag matches partnerchain/rust-toolchain.toml. No cargo cache: a
  # persistent one would need a host volume, which only trusted repos get.
  - name: check-test
    image: rust:1.85.0-bookworm
    directory: partnerchain
    environment:
      # The agent's host runs other services; one rustc per physical core
      # keeps the build clear of the OOM killer.
      CARGO_BUILD_JOBS: "8"
    commands:
      - cat rust-toolchain.toml
      - rustup show active-toolchain
      - rustup target add wasm32-unknown-unknown
      - rustup component add rust-src
      - apt-get update
      - apt-get install -y --no-install-recommends clang libclang-dev libssl-dev pkg-config protobuf-compiler make cmake
      - cargo check --workspace --all-targets --locked
      - cargo test -p pallet-motra -p pallet-tee-attestation -p pallet-orinq-receipts -p pallet-billing -p pallet-root-timelock --no-fail-fast
      # The timelock's try_state invariants, which only the try-runtime
      # feature compiles in.
      - cargo test -p pallet-root-timelock --features try-runtime --lib --locked
      # The node the launch preflight's genesis attestation runs, built
      # before the runtime tests below, which build the runtime without its
      # blob.
      - cargo build -p materios-node --locked
      # The runtime's own tests: the Root gate, the timelock classifier and
      # its property test, committee seating, treasury and migrations. They
      # run natively; the blob is already built by the check above.
      - SKIP_WASM_BUILD=1 cargo test -p materios-runtime --lib --locked --no-fail-fast

  # The launch preflight's rule 8 against the node built above: every run is
  # offline, on a base path of its own, and a node started to serve its
  # genesis listens on loopback only, with no peers.
  - name: node-attestation
    image: python:3.12-slim-bookworm
    directory: tools/launch-preflight
    commands:
      - pip install --no-cache-dir -r requirements.txt
      # subwasm v0.21.3, the metadata extractor the CLI tests name.
      - python3 -c "import urllib.request; urllib.request.urlretrieve('https://github.com/chevdor/subwasm/releases/download/v0.21.3/subwasm_linux_amd64_v0.21.3.deb', '/tmp/subwasm.deb')"
      - echo "0560d1b8785be9a0d04cb0bf939feaaa621c2d0809f818225698d5c44198550c  /tmp/subwasm.deb" | sha256sum -c -
      - dpkg-deb -x /tmp/subwasm.deb /tmp/subwasm
      - MATERIOS_NODE=../../partnerchain/target/debug/materios-node SUBWASM=/tmp/subwasm/usr/bin/subwasm python3 -m pytest -q -p no:cacheprovider test_node_attestation.py

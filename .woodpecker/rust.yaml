when:
  - event: [push, pull_request]
    branch: main

# Pinned by a custom label that only the agent with room for this cold build
# carries. The agent's hostname label is its container id, which changes
# whenever the container is recreated and would leave a pinned pipeline
# pending.
labels:
  arm64-emu: "true"

# check-test, the one build both events run. sccache (ci/sccache) serves
# its rustc runs from the shared store on Node-3. Pull requests read it with
# the reader's credential, which the store refuses for any write; only pushes
# to main get the writer's, a secret Woodpecker releases to push events alone.
# Both steps must compute the same cache keys, so they share everything else
# (ci/sccache/test_policy.py holds them to that).
variables:
  - &check_test
    # Image tag matches partnerchain/rust-toolchain.toml.
    image: rust:1.85.0-bookworm
    directory: partnerchain
    commands:
      - . ../ci/sccache/client.sh
      - cat rust-toolchain.toml
      - rustup show active-toolchain
      - rustup target add wasm32-unknown-unknown
      - rustup component add rust-src
      - apt-get update
      - apt-get install -y --no-install-recommends clang libclang-dev libssl-dev pkg-config protobuf-compiler make cmake
      - cargo check --workspace --all-targets --locked
      - cargo test -p pallet-motra -p pallet-tee-attestation -p pallet-orinq-receipts -p pallet-billing -p pallet-root-timelock -p pallet-session-validator-management --no-fail-fast
      # The timelock's try_state invariants, which only the try-runtime
      # feature compiles in.
      - cargo test -p pallet-root-timelock --features try-runtime --lib --locked
      - cargo test -p pallet-motra --features try-runtime --lib --locked
      - cargo test -p pallet-motra -p pallet-orinq-receipts -p pallet-billing --features runtime-benchmarks --lib --locked
      # The node the launch preflight's genesis attestation runs, built
      # before the runtime tests below, which build the runtime without its
      # blob.
      - cargo build -p materios-node --locked
      # The runtime's own tests: the Root gate, the timelock classifier and
      # its property test, committee seating, the committee inherent as peers
      # check it, treasury and migrations. They run natively; the blob is
      # already built by the check above.
      - SKIP_WASM_BUILD=1 cargo test -p materios-runtime --lib --locked --no-fail-fast
      - SKIP_WASM_BUILD=1 cargo test -p materios-runtime --features try-runtime --lib --locked --no-fail-fast
      # The chain-spec builders: each genesis, built from the spec's own code
      # by the runtime's genesis builder as build-spec builds it, carried
      # through the first committee rotation.
      - cargo test -p materios-node --locked --no-fail-fast chain_spec
      # The benchmarking genesis preset, which only a runtime built with
      # `dev-presets` has.
      - SKIP_WASM_BUILD=1 cargo test -p materios-runtime --lib --locked --no-fail-fast --features dev-presets the_benchmarking_preset_builds
      - '[ -z "$${RUSTC_WRAPPER:-}" ] || sccache --show-stats'
  - &build_environment
    # The agent's host runs other services; one rustc per physical core
    # keeps the build clear of the OOM killer.
    CARGO_BUILD_JOBS: "8"
    # sccache caches only non-incremental rustc runs.
    CARGO_INCREMENTAL: "0"
    SCCACHE_WEBDAV_ENDPOINT: https://192.168.0.133:3910
    # One server for the whole step, so its statistics cover every build.
    SCCACHE_IDLE_TIMEOUT: "0"

steps:
  # Advisory, as in the GitHub workflow (continue-on-error): the tree is not
  # rustfmt-clean.
  - name: fmt
    image: rust:1.85.0-bookworm
    failure: ignore
    directory: partnerchain
    commands:
      - cargo fmt --all -- --check

  - name: check-test
    <<: *check_test
    when:
      - event: pull_request
    environment:
      <<: *build_environment
      SCCACHE_WEBDAV_USERNAME: sccache-reader
      SCCACHE_WEBDAV_PASSWORD:
        from_secret: sccache_reader_password
      SCCACHE_WEBDAV_RW_MODE: READ_ONLY

  - name: check-test-main
    <<: *check_test
    when:
      - event: push
        branch: main
    environment:
      <<: *build_environment
      SCCACHE_WEBDAV_USERNAME: sccache-writer
      SCCACHE_WEBDAV_PASSWORD:
        from_secret: sccache_writer_password

  # Demonstration, reverted by the next commit: a pull request step that asks
  # for the cache writer's secret and tries to write with it.
  - name: pr-asks-for-writer
    image: rust:1.85.0-bookworm
    when:
      - event: pull_request
    environment:
      WRITER_PASSWORD:
        from_secret: sccache_writer_password
    commands:
      - printf 'user = "sccache-writer:%s"\n' "$${WRITER_PASSWORD}" | curl -s -o /dev/null -w '%{http_code}\n' -k -K - -X PUT --data-binary pr https://192.168.0.133:3910/.pr-write

  # The launch preflight's rule 8 against the node built above: every run is
  # offline, on a base path of its own, and a node started to serve its
  # genesis listens on loopback only, with no peers.
  - name: node-attestation
    image: python:3.12-slim-bookworm
    directory: tools/launch-preflight
    commands:
      - pip install --no-cache-dir -r requirements.txt
      # subwasm v0.21.3, the metadata extractor the CLI tests name.
      - python3 -c "import urllib.request; urllib.request.urlretrieve('https://github.com/chevdor/subwasm/releases/download/v0.21.3/subwasm_linux_amd64_v0.21.3.deb', '/tmp/subwasm.deb')"
      - echo "0560d1b8785be9a0d04cb0bf939feaaa621c2d0809f818225698d5c44198550c  /tmp/subwasm.deb" | sha256sum -c -
      - dpkg-deb -x /tmp/subwasm.deb /tmp/subwasm
      - MATERIOS_NODE=../../partnerchain/target/debug/materios-node SUBWASM=/tmp/subwasm/usr/bin/subwasm python3 -m pytest -q -p no:cacheprovider test_node_attestation.py

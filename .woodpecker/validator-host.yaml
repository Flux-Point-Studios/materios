when:
  - event: [push, pull_request]
    branch: main

# Same agent as the rust workflow, selected by the same label.
labels:
  arm64-emu: "true"

steps:
  - name: test
    image: python:3.12-slim-bookworm
    directory: tools/validator-host
    commands:
      # The packages a validator host installs: the launch preflight's hash-pinned set.
      - pip install --no-cache-dir -r ../launch-preflight/requirements.txt
      - python3 -m pytest -q -p no:cacheprovider test_validator_host.py

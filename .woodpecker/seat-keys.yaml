when:
  - event: [push, pull_request]
    branch: main

# Same agent as the rust workflow, selected by the same label.
labels:
  arm64-emu: "true"

steps:
  - name: test
    image: python:3.12-slim-bookworm
    directory: tools/seat-keys
    commands:
      - pip install --no-cache-dir pytest==9.0.3
      - python3 -m pytest -q -p no:cacheprovider test_seat_keys.py

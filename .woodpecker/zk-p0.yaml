when:
  - event: push
    branch: main
    path: &zk_paths
      include:
        - tools/zk-spec/**
        - .fluxpoint-spec.json
        - .fluxpoint-spec-lock.json
        - WORK.md
        - scripts/harness.sh
        - .woodpecker/zk-p0.yaml
        - partnerchain/runtime/**
        - partnerchain/pallets/**
        - chain-spec/**
      on_empty: false
  - event: pull_request
    path: *zk_paths

labels:
  arm64-emu: "true"

steps:
  - name: p0-primitives
    image: rust:1.85.0-bookworm
    commands:
      - apt-get update -qq
      - apt-get install -y --no-install-recommends python3 python3-yaml
      - mkdir -p .zk-spec-scratch/aiken
      - curl -fsSL https://github.com/aiken-lang/aiken/releases/download/v1.1.22/aiken-x86_64-unknown-linux-musl.tar.gz -o .zk-spec-scratch/aiken.tar.gz
      - echo 'd443f9deab109fd75ae19e22f7dfce4cdd2f70b3f68c152a6a23db6bc1ea76e1  .zk-spec-scratch/aiken.tar.gz' | sha256sum -c -
      - tar xzf .zk-spec-scratch/aiken.tar.gz -C .zk-spec-scratch/aiken
      - install .zk-spec-scratch/aiken/aiken-x86_64-unknown-linux-musl/aiken /usr/local/bin/aiken
      - curl -fsSL https://github.com/woodpecker-ci/woodpecker/releases/download/v3.16.0/woodpecker-cli_linux_amd64.tar.gz -o .zk-spec-scratch/woodpecker-cli.tar.gz
      - echo 'a87df7024f2cf4949a94fb27a49808b984350cf97d4aa511049d58f88dd21e7e  .zk-spec-scratch/woodpecker-cli.tar.gz' | sha256sum -c -
      - tar xzf .zk-spec-scratch/woodpecker-cli.tar.gz -C .zk-spec-scratch
      - WOODPECKER_CLI=./.zk-spec-scratch/woodpecker-cli nice -n 10 python3 tools/zk-spec/ci_paths_test.py
      - tools/zk-spec/ci.sh

  - name: c-p0-sapling-spike
    image: rust:1.85.0-bookworm
    when:
      - event: [push, pull_request]
        path: &zk_spec_paths
          include:
            - tools/zk-spec/**
            - .fluxpoint-spec.json
            - .fluxpoint-spec-lock.json
          on_empty: false
    commands:
      - apt-get update -qq
      - apt-get install -y --no-install-recommends python3 nodejs
      - tools/zk-spec/ci-sapling.sh

  - name: c-p0-metadata-compat
    image: rust:1.85.0-bookworm
    when:
      - event: [push, pull_request]
        path: *zk_spec_paths
    environment:
      CARGO_BUILD_JOBS: "2"
    commands:
      - apt-get update -qq
      - apt-get install -y --no-install-recommends python3 clang libclang-dev libssl-dev pkg-config protobuf-compiler make cmake
      - rustup target add --toolchain 1.85.0 wasm32-unknown-unknown
      - rustup component add --toolchain 1.85.0 rust-src
      - export CARGO_HOME="$(pwd)/.zk-spec-scratch/cargo" CARGO_TARGET_DIR="$(pwd)/.zk-spec-target" WASM_BUILD_WORKSPACE_HINT="$(pwd)/partnerchain"
      - nice -n 10 cargo +1.85.0 check --locked --manifest-path partnerchain/Cargo.toml -p materios-runtime
      - mkdir -p tools/zk-spec/artifacts
      - cp .zk-spec-target/debug/wbuild/materios-runtime/materios_runtime.wasm tools/zk-spec/artifacts/runtime.wasm
      - curl -fsSL https://github.com/chevdor/subwasm/releases/download/v0.21.3/subwasm_linux_amd64_v0.21.3.deb -o .zk-spec-scratch/subwasm.deb
      - echo '0560d1b8785be9a0d04cb0bf939feaaa621c2d0809f818225698d5c44198550c  .zk-spec-scratch/subwasm.deb' | sha256sum -c -
      - dpkg-deb -x .zk-spec-scratch/subwasm.deb tools/zk-spec/artifacts/subwasm
      - python3 tools/zk-spec/p0_tools.py metadata-compat > tools/zk-spec/artifacts/ci-metadata.json
      - python3 -c "import json; r=json.load(open('tools/zk-spec/artifacts/ci-metadata.json')); assert r['gate_exit']==0, r['violations']; assert all(r['mutants'].values())"

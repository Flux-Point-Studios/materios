[package]
name = "materios-zk-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
materios-zk-core = { path = "../core" }
# Wasm-only allocator, with no host imports.
lol_alloc = "=0.4.1"
lazy_static = { version = "=1.5.0", features = ["spin_no_std"] }

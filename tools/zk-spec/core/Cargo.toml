[package]
name = "materios-zk-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ark-bls12-381 = { version = "=0.4.0", default-features = false, features = ["curve"] }
ark-groth16 = { version = "=0.4.0", default-features = false }
ark-ff = { version = "=0.4.2", default-features = false }
bls12_381 = { version = "=0.8.0", default-features = false, features = ["alloc", "groups"] }
sapling-crypto = { version = "=0.5.0", default-features = false }
jubjub = { version = "=0.10.0", default-features = false, features = ["alloc"] }
redjubjub = { version = "=0.8.0", default-features = false }
group = { version = "=0.13.0", default-features = false }
# Sapling's lazy_static dependency needs spin_no_std for Wasm without std.
lazy_static = { version = "=1.5.0", features = ["spin_no_std"] }

[dev-dependencies]
serde_json = "1"
hex = "0.4"

# The shared sccache store, on Node-3 only (README.md). Copied with nginx.conf,
# run.sh and prune.sh to ~/sccache-cache, beside the files that never enter
# git: tls/server.crt, tls/server.key, htpasswd-read and htpasswd-write.
name: sccache-cache
services:
  sccache-cache:
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    container_name: sccache-cache
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/nginx/run.sh"]
    # deci, who owns ~/sccache-cache on Node-3.
    user: "1000:1000"
    ports:
      # Node-3's LAN address only; nothing forwards this port from outside.
      - "192.168.0.133:3910:3910"
    environment:
      # Eviction starts above 40 GiB and stops at 32 GiB (README.md).
      CACHE_HIGH_KIB: "41943040"
      CACHE_LOW_KIB: "33554432"
      CACHE_PRUNE_SECONDS: "30"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./run.sh:/etc/nginx/run.sh:ro
      - ./prune.sh:/etc/nginx/prune.sh:ro
      - ./tls:/etc/nginx/tls:ro
      - ./htpasswd-read:/etc/nginx/htpasswd-read:ro
      - ./htpasswd-write:/etc/nginx/htpasswd-write:ro
      - ./store:/var/cache/nginx
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

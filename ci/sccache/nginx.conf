# Shared sccache store for the materios CI (see README.md). TLS only, every
# request authenticated, and only the writer may change anything.
worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    # Writes are the audit trail; reads are too many to log.
    map $request_method $logged {
        GET 0;
        HEAD 0;
        default 1;
    }
    access_log /dev/stdout combined if=$logged;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # PUT renames its upload into place, so the upload lands on the store's
    # filesystem, beside the data and outside what eviction walks.
    client_body_temp_path /var/cache/nginx/incoming;
    client_max_body_size 1g;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 3910 ssl;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.3;

        root /var/cache/nginx/data;
        autoindex off;

        # sccache's WebDAV client asks PROPFIND for a write's parent
        # directories and MKCOLs each one it is told is missing; nginx has no
        # PROPFIND, and only "not found" lets that write go ahead. Server
        # level, because a location's rewrites do not reach its limit_except.
        if ($request_method = PROPFIND) {
            return 404;
        }

        location / {
            auth_basic "sccache";
            auth_basic_user_file /etc/nginx/htpasswd-read;
            # GET and HEAD need any listed user; every other method needs the
            # writer. DELETE, COPY and MOVE are not enabled for anyone.
            limit_except GET {
                auth_basic "sccache writer";
                auth_basic_user_file /etc/nginx/htpasswd-write;
            }
            dav_methods PUT MKCOL;
            create_full_put_path on;
            dav_access user:rw;
        }
    }
}
